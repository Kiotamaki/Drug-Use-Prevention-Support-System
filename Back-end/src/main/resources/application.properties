spring.application.name=drug-use-prevention-support-system

# ===================== DataSource Configuration =====================
spring.datasource.url=jdbc:mysql://localhost:3306/drug_use_prevention_support_system
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================== JPA / Hibernate =====================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ===================== Flyway =====================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.baseline-description=init

jwt.secret=fpt-university-swp391-su25-drug-use-prevention-support-system
jwt.issuer=swp.com
jwt.valid-duration=600000
jwt.refreshable-duration=60000